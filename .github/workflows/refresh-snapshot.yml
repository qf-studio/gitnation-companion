name: Refresh snapshot

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Refresh snapshot from upstream
        run: pnpm refresh:snapshot

      - name: Summarize diff
        id: stats
        run: |
          {
            echo "files<<EOF"
            git diff --stat data/ || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore: snapshot refresh'
          title: 'chore: snapshot refresh'
          body: |
            Daily snapshot refresh from upstream `_next/data` JSON.

            Review the diff for upstream schema drift before merging.

            Stats:
            ```
            ${{ steps.stats.outputs.files }}
            ```
          branch: chore/snapshot-refresh
          delete-branch: true
